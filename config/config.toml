# ed2k-server configuration
# WSL testing: keep as-is
# VPS public deployment: set this_ip, name, desc; uncomment seed_servers

[server]
name = "Test eD2k Server"
desc = "ed2k-server open source"

# Public server: announces itself to peers and is shared in server lists.
# A public server REQUIRES a non-empty content_filter.hash_banlist, or it
# refuses to start (see [content_filter] below). Keep `false` for local/WSL
# testing; set `true` only once this_ip, seed_servers and a hash blocklist
# are configured for a real VPS deployment.
public = false

# Advertised server version. Do NOT set below 17.15: Lugdunum servers reject
# older versions and will not add them to their server.met (verified against
# the Lugdunum decompile — 17.15 is the minimum accepted version).
version_major = 17
version_minor = 15

# Public IP of this server — shown to clients in SERVERIDENT.
# Leave empty for WSL/local testing. Set to VPS IP for public deployment.
# this_ip = "1.2.3.4"

# Seed servers — queried on startup via UDP to fetch the current server list.
# This is how your server discovers peers and eventually gets into their lists.
# Standard well-known eD2k servers (public, long-running):
# seed_servers = [
#     "91.200.42.46:1176",
#     "176.123.5.87:4242",
#     "77.120.115.66:4242",
#     "62.210.28.77:4242",
# ]

[network]
tcp_port = 4661
listen_ip = "0.0.0.0"
listen_backlog = 256
max_frame_size = 1_000_000
# Ceiling on what one compressed (0xD4) frame may decompress to. Must be >= 1.
max_decompressed_frame_size = 8_000_000
login_timeout_ms = 2000
support_crypt = true

# HighID hello check (live): re-check HighID clients with OP_HELLO in the
# background. observe = count only; downgrade = a port answering with ANOTHER
# client's hash gives that client LowID on its next logins. See README.
highid_verify_observe = false
highid_downgrade_on_wrong_hash = false
highid_wrong_hash_ttl_secs = 86400

# IPv6 (off for local testing). ipv6_enabled/listen_ip6 need a restart.
ipv6_enabled = false
listen_ip6 = "::"
this_ip6 = ""
ipv6_publish_sources = false

[limits]
max_clients = 1000
soft_limit_files = 1000
hard_limit_files = 4000
max_clients_per_ip = 10
max_string_size = 250
ping_delay_seconds = 300
# Results per search, best-sourced first (live).
max_search_results = 200
# Candidates examined per search while ranking (live).
search_rank_scan = 20000
# Index letter/digit pieces of words: S01E08 -> s01, e08 (restart; off = old behaviour).
index_subtokens = false
# Ignore query words no indexed file contains instead of returning nothing (live).
search_drop_unknown_words = true

[content_filter]
# Layer 3 hash blocklist(s). Obtain from authoritative sources (NCMEC/IWF/C3P);
# do NOT commit. A public server (server.public = true) requires a non-empty list.
hash_banlist = []
# Layer 5 "poisoned index" hash list(s). Optional. Blocked like any other layer,
# but NEVER held against the publisher: no csam_attempts, no ban progress. Put
# decoys here — one hash advertised under a dozen unrelated names — so that
# hash_banlist keeps meaning exactly one thing.
hash_filter = []
# Layer 4 operator extra terms (substring). Optional. Not shipped — see *.example.
extra_terms_file = "config/csam_terms_extra.txt"
# Layer 1 jargon list. Optional; absent = L1 inactive (L2-L4 still run). Source
# from INHOPE/IWF/NCMEC; not shipped — copy config/csam_jargon.txt.example and fill.
jargon_terms_file = "config/csam_jargon.txt"

# Layer 2 vocabulary. Layer 2 blocks on the CO-OCCURRENCE of an age claim and a
# sexual context, and its word lists used to be compiled into the binary — so
# every addition meant a rebuild and a restart, and a restart drops every
# connected client.
#
# Absent => the built-in lists are used, which is exactly what the server did
# before this option existed. A file REPLACES the sections it names and leaves
# the rest at their defaults. Hot-reloaded within 30 s of an mtime change.
# See config/layer2_terms.txt.example for the format.
layer2_terms_file = "/etc/ed2k-server/layer2_terms.txt"
publisher_attempt_disconnect_threshold = 3
publisher_blacklist_seconds = 86400
publisher_count_window_seconds = 86400

[welcome]
messages = [
    "Welcome to ed2k-server",
]

[log]
level = "info"
connection_trace = true

[storage]
# IP filter in eMule guarding.p2p format. Empty = disabled. Hot-reloaded on
# SIGHUP without restart. Obtain a list (e.g. bluetack/level1) and point here.
ipfilter_path = ""
# ip-to-country.csv for the per-client country column in the admin UI.
# Format: start_int,end_int,ISO2,CountryName. Empty = disabled.
# Source: https://upd.emule-security.org/ip-to-country.csv.zip (unzip first).
country_db_path = ""
# MaxMind DB for GeoIP, IPv4 + IPv6, with provider names (e.g. IPinfo Lite,
# ipinfo_lite.mmdb, or GeoLite2-Country.mmdb). Tried before country_db_path;
# when it is missing or unreadable the CSV is used. Empty = ipinfo_lite.mmdb
# in the same directory as country_db_path; "off" = CSV only.
geoip_mmdb_path = ""

[admin]
# Localhost-only admin web UI. Access via SSH tunnel:
#   ssh -L 8080:127.0.0.1:8080 your-vps
# Then open http://localhost:8080 in a browser.
enabled = true
port = 8080

[admission]
# Server-wide ceilings on remotely caused work (issue #25). Restart-only; no
# value accepts 0. Every key is optional — the defaults are shown. See README.
#
# The defaults are sized for 50 000 clients (~45 000 LowID) and 30 000 000
# files, including the moment after a restart when all of them reconnect at
# once. They lean high on purpose: a ceiling costs memory only while it is
# used, while one that is too low refuses real users.
#
# max_open_tcp_connections = <max_clients + 10% + max_pending_logins>
#     Keep open sockets + max_probe_jobs under LimitNOFILE (each probe is an
#     outbound socket). For 50 000 clients: 87 768 + 32 832 -> LimitNOFILE=262144.
# max_pending_logins = 32768
#     Reconnect storm: a LowID client's slot is held for the whole HighID
#     probe (login_timeout_ms). Measured peak above 0.45 pending per client;
#     at 50 000 clients that is ~23 000 at once.
# max_pending_logins_per_source = 32   # CGNAT / VPN exits reconnect together
# max_probe_jobs = <max_pending_logins + 64>   # full -> the login gets LowID
# max_retry_tasks = 1024
# session_relay_per_second = 10   # callback / hole-punch requests per session;
# session_relay_burst = 200       # LowID-heavy population, callbacks are common
# max_search_jobs = 8             # searches running at once (30M-file index)
# max_queued_tcp_searches = 512
# tcp_search_wait_ms = 2000
# max_queued_udp_searches = 128
# udp_search_wait_ms = 500
# max_rate_state_entries = 524288  # UDP sources tracked at once, <= ~50 MB
# ipv6_source_prefix_bits = 64
# udp_global_credits_per_second = 200000
# udp_global_burst_credits = 400000
# udp_source_credits_per_second = 60   # one source can be a whole CGNAT
# udp_source_burst_credits = 1000
# Observe first: over-budget UDP is counted but served. Set true to drop it.
udp_rate_enforce = false
# readiness_window_secs = 30
