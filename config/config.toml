# ed2k-server configuration — the one template, for a public server.
#
# Install: copy to /etc/ed2k-server/config.toml and replace every CHANGE_ME
# (name, desc, this_ip, the welcome message). The server refuses to start while
# name or this_ip still read CHANGE_ME. Paths below assume /etc/ed2k-server;
# the [updates] section keeps the data files there current. See README,
# "Installing on a VPS".

[server]
name = "CHANGE_ME"              # Your server name shown in eMule server lists
desc = "CHANGE_ME"              # Description
# A public server must have a hash ban list configured (content_filter.
# hash_banlist below); with public = true the server refuses to start without
# one. The file itself may still be missing at the first start: it is loaded
# within 30 s of appearing, whether copied by hand or installed by [updates].
public = true

# Your VPS public IP — clients see this in SERVERIDENT
this_ip = "CHANGE_ME"          # e.g. "65.109.199.83"

# Well-known seed servers — your server will query them on startup
# to get a list of active eD2k servers. Eventually other servers
# will discover yours and add it to their lists.
seed_servers = [
"213.252.245.239:43333",
"185.25.48.89:18357",
"147.78.0.252:18357",
"37.143.128.252:47111",
"185.123.101.79:42830",
"176.123.5.89:4725",
"103.97.203.251:42011",
"147.78.2.254:9197",
"223.165.4.251:42011",
"91.148.135.254:9197",
"91.148.135.252:47111",
"91.148.135.253:18357",
"91.208.162.182:4232",
"91.208.162.87:4232",
"85.121.5.137:4232",
"77.42.68.79:4232",
"141.227.165.99:4232",
"185.186.77.252:47111",
"145.14.131.254:43333",
"185.255.123.22:37980",
"31.40.212.254:9197",
"185.237.185.226:31031",
"57.131.35.107:4232",
"91.119.202.44:4321",
"213.141.198.207:4232",
"85.17.116.222:6082",
"212.95.35.240:4232",
"193.187.90.12:4661",
"91.126.170.253:5687",
]
version_major = 18
version_minor = 1

[network]
tcp_port = 4661
listen_ip = "0.0.0.0"          # DO NOT change to your VPS IP — 0.0.0.0 is correct
listen_backlog = 1024
max_frame_size = 1_000_000
# Ceiling on what one compressed (0xD4) frame may decompress to. Must be >= 1.
max_decompressed_frame_size = 8_000_000
login_timeout_ms = 3000         # Slightly longer for VPS latency
support_crypt = true

# Give clients that reach this server from a PRIVATE address a chance at HighID,
# by probing server.this_ip on their port instead of the unroutable one.
#
# For the case where an operator runs a client on the same network as the server:
# the client reaches it through the router's hairpin NAT, so the login arrives
# from an RFC1918 address and would otherwise always be LowID.
#
# ⚠ OFF BY DEFAULT and the default is the cautious one. A server in a datacentre
#   may see private addresses from a management network unrelated to its public
#   address, and where a router source-NATs hairpin traffic every local client
#   arrives from the SAME address, so a port forward may lead to a different
#   machine than the one that logged in. The probe therefore requires the peer to
#   answer with the user hash that just logged in; if that check is ever
#   weakened, this option must go with it.
hairpin_lan_clients = false

# ── HighID hello check ──────────────────────────────────────────────────────
# HighID is decided by a TCP connect to the client's port. That proves something
# listens there, not that it is THIS client: behind a NAT shared by two eD2k
# clients (two machines at home, or strangers behind a provider's CGNAT) the
# forward leads to one of them and the other used to get a HighID that sends
# every peer to the wrong machine.
#
# Both options below re-check HighID clients with a client-to-client OP_HELLO in
# the BACKGROUND and compare the user hash in the answer. The login is never
# delayed. Counters on the Status tab, cases in GET /api/highid_mismatches.
#
# observe  — count only, nothing changes for the client.
# downgrade — a port that answers with ANOTHER client's hash marks
#             (IP, port, login hash); that client's next logins get LowID until
#             the mark expires or its own hash answers again. The first session
#             after a mismatch keeps HighID.
#
# No answer (silent close, reset, timeout — often just the peer's IP filter)
# NEVER costs HighID. The hairpin path above is separate and unaffected.
highid_verify_observe = true
highid_downgrade_on_wrong_hash = true
highid_wrong_hash_ttl_secs = 86400      # 24 h

# ── IPv6 ────────────────────────────────────────────────────────────────────
# Accept clients over IPv6: separate IPv6-only sockets, TCP on tcp_port and UDP
# on tcp_port + 4. The IPv4 path is unchanged, and a host without IPv6 logs a
# warning and keeps serving IPv4. Restart to apply.
ipv6_enabled = true
listen_ip6 = "::"                       # DO NOT change — :: is correct

# Your VPS public IPv6, announced to clients that speak the extension.
# Leave empty if the VPS has none.
this_ip6 = ""                           # e.g. "2001:db8:1234::2"

# Publish a client that is LowID on IPv4 but has a public IPv6 as an IPv6 source,
# to peers that can parse it (eMuleQt, eNode-go and compatible mods). Clients
# that do not know the extension never see it. Independent of ipv6_enabled.
ipv6_publish_sources = true

[limits]
max_clients = 5000
soft_limit_files = 5000
hard_limit_files = 7500
max_clients_per_ip = 10
max_string_size = 250
ping_delay_seconds = 300

# ── Search ──────────────────────────────────────────────────────────────────
# Results per search, across all pages; best-sourced first. One value for every
# client (Lugdunum varies it by zlib support and halves it for LowID).
# Default 200, ceiling 5000.
max_search_results = 300
# Candidates examined when ranking one search; must be >= max_search_results.
# The share of searches that hit it is on the Status tab.
search_rank_scan = 20000
# Also index letter/digit pieces of words: S01E08 is found by s01 and e08,
# 1080p by 1080. Read at STARTUP only. Off = the behaviour before 0.9.76.
index_subtokens = true
# Ignore query words no indexed file contains instead of returning nothing
# (a typo no longer empties the search). A query of only unknown words still
# returns nothing.
search_drop_unknown_words = true

# ── Fast publishing: OFFERFILES v1 (README, "OFFERFILES v1") ────────────────
# Answer clients that ask for it at login (aMule with the experimental option)
# with how many files per OFFERFILES and how often, instead of the legacy 200
# files a minute; those connections are then held to exactly that. Clients
# that do not ask are never affected.
# Needs soft_limit_files > 0 and hard_limit_files > offerfiles_batch_max,
# otherwise nothing is advertised and an error is logged. Off by default.
offerfiles_v1 = false
offerfiles_batch_max = 200
offerfiles_min_interval_ms = 500
# All v1 connections together, records per second; 0 = no ceiling.
offerfiles_global_records_per_sec = 5000

[content_filter]
# BAN LIST: blocked AND counted against the publisher. Material whose publisher
# should answer for it — CSAM and bestiality alike, which is why the file is no
# longer named after only one of them.
hash_banlist = ["/etc/ed2k-server/hash_banlist.txt"]
# FILTER LIST: blocked, publisher NOT accused. Decoys (one hash under a dozen
# unrelated names) and takedown requests — a rightsholder complaint means the
# file leaves the index, and says nothing about whoever happens to share it.
hash_filter = ["/etc/ed2k-server/hash_filter.txt"]
extra_terms_file = "/etc/ed2k-server/csam_terms_extra.txt"
jargon_terms_file = "/etc/ed2k-server/csam_jargon.txt"

# Layer 2 vocabulary. Layer 2 blocks on the CO-OCCURRENCE of an age claim and a
# sexual context, and its word lists used to be compiled into the binary — so
# every addition meant a rebuild and a restart, and a restart drops every
# connected client.
#
# Absent => the built-in lists are used, which is exactly what the server did
# before this option existed. A file REPLACES the sections it names and leaves
# the rest at their defaults. Hot-reloaded within 30 s of an mtime change.
# See config/layer2_terms.txt.example for the format.
layer2_terms_file = "/etc/ed2k-server/layer2_terms.txt"
# Verified false positives. Overrides EVERY layer, not just the hash lists — the
# mistakes that actually happen are term matches (song titles, historical texts).
whitelist_hashes_file = "/etc/ed2k-server/whitelist_hashes.txt"
# Distinct blocked files tolerated before a ban. Read together with the counting
# window below: at 24 h this means "N in a day", which a collector cannot reach
# by accident and a bulk publisher clears in one OFFERFILES packet.
publisher_attempt_disconnect_threshold = 150
publisher_blacklist_seconds = 2592000      # 30 days — how long the BAN lasts
# How far back distinct blocked files count toward the threshold. Short on
# purpose: at 30 days the rule read "N files in a month", which banned collectors
# of tag-stuffed adult video for a slow drip. Omit to fall back to the ban length.
publisher_count_window_seconds = 86400     # 24 hours

[welcome]
messages = [
    "Welcome to CHANGE_ME",
]

[log]
level = "warn"
connection_trace = false        # Set to true only for debugging

[storage]
ipfilter_path = "/etc/ed2k-server/guarding.p2p"
country_db_path = "/etc/ed2k-server/ip-to-country.csv"
# MaxMind DB (IPv4 + IPv6, with provider names). Tried first; when it is
# missing or unreadable the CSV above is used.
geoip_mmdb_path = "/etc/ed2k-server/ipinfo_lite.mmdb"

[admin]
enabled = true
port = 8080

[updates]
# Update service for the filter data files. See UPDATE-SERVICE.md.
#
# Without the term and hash lists the content filter has very little to work
# with, and those lists cannot be published in a public repository. This section
# is how a server gets them.
enabled = true

# Where files are installed. Must match the paths in [content_filter] and
# [storage] above, or an update lands where nothing is watching.
dest_dir = "/etc/ed2k-server"

# Ed25519 public key (32 bytes, hex) that data files must be signed with.
#
# READ THIS BEFORE LEAVING IT EMPTY. A hijacked domain or a compromised update
# host can push an EMPTY vocabulary — every layer using it then silently matches
# nothing, on every server that pulled — or one hash of a popular legal release
# into the ban list, which bans its publishers for thirty days everywhere at
# once. The signature is checked before anything is written, and it is the only
# defence that does not depend on who controls the domain.
#
# The value below belongs to the emule-security.org update service. It is a
# PUBLIC key: it can verify a signature and cannot create one. Replace it if you
# run your own service.
public_key = "102f8ec039fb6fcfe75dfd00cfc5cfed76d1f006aa03f0825e69f30e8c2d836d"
require_signature = true

# Credential for the access-controlled files. Derived, not stored: it is
# IPObfuscate(our seckey, this address) — the same number this server already
# sends that peer during the obfuscated server-to-server handshake, so the
# service can be given the table without any registration step. Set it to the
# server whose exported peer table the service loaded.
key_reference_ip = ""

backups = 3
min_keep_ratio = 0.5

# Peer table export: the (IP, key) pairs of servers that completed gossip with
# us, so the service can recognise them.
#
# ⚠ export_token is a SECRET and is deliberately empty here. Anyone holding it
#   can push a peer table to the service. Ask the service operator for one; do
#   not copy a token out of a public repository, and do not commit yours.
export_url = ""
export_token = ""
export_interval_secs = 3600

[updates.urls]
# The two public files carry no access control and have compiled-in defaults;
# they are spelled out here only so the paths are visible.
guarding_p2p     = "https://ed2k.emule-security.org/pub/guarding.p2p"
ip_to_country    = "https://ed2k.emule-security.org/pub/ip-to-country.csv.zip"
# GeoIP for IPv4 + IPv6 (MaxMind DB). Public data; no compiled-in default.
geoip_mmdb       = "https://ed2k.emule-security.org/pub/ipinfo_lite.mmdb.zip"
# The rest identify material and are fetched with the access key above. Empty
# until an update service has granted this server access.
csam_jargon = "https://ed2k.emule-security.org/files/csam_jargon.txt"
csam_terms_extra = "https://ed2k.emule-security.org/files/csam_terms_extra.txt"
layer2_terms = "https://ed2k.emule-security.org/files/layer2_terms.txt"
hash_banlist = "https://ed2k.emule-security.org/files/hash_banlist.txt"
hash_filter = "https://ed2k.emule-security.org/files/hash_filter.txt"
whitelist_hashes = "https://ed2k.emule-security.org/files/whitelist_hashes.txt"

[admission]
# Server-wide ceilings on remotely caused work (issue #25). Restart-only; no
# value accepts 0. Every key is optional — the defaults are shown. See README.
#
# The defaults are sized for 50 000 clients (~45 000 LowID) and 30 000 000
# files, including the moment after a restart when all of them reconnect at
# once. They lean high on purpose: a ceiling costs memory only while it is
# used, while one that is too low refuses real users.
#
# max_open_tcp_connections = <max_clients + 10% + max_pending_logins>
#     Keep open sockets + max_probe_jobs under LimitNOFILE (each probe is an
#     outbound socket). For 50 000 clients: 87 768 + 32 832 -> LimitNOFILE=262144.
# max_pending_logins = 32768
#     Reconnect storm: a LowID client's slot is held for the whole HighID
#     probe (login_timeout_ms). Measured peak above 0.45 pending per client;
#     at 50 000 clients that is ~23 000 at once.
# max_pending_logins_per_source = 32   # CGNAT / VPN exits reconnect together
# max_probe_jobs = <max_pending_logins + 64>   # full -> the login gets LowID
# max_retry_tasks = 1024
# session_relay_per_second = 10   # callback / hole-punch requests per session;
# session_relay_burst = 200       # LowID-heavy population, callbacks are common
# max_search_jobs = 8             # searches running at once (30M-file index)
# max_queued_tcp_searches = 512
# tcp_search_wait_ms = 2000
# max_queued_udp_searches = 128
# udp_search_wait_ms = 500
# max_rate_state_entries = 524288  # UDP sources tracked at once, <= ~50 MB
# ipv6_source_prefix_bits = 64
# udp_global_credits_per_second = 200000
# udp_global_burst_credits = 400000
# udp_source_credits_per_second = 60   # one source can be a whole CGNAT
# udp_source_burst_credits = 1000
# Observe first: over-budget UDP is counted but served. Set true to drop it.
udp_rate_enforce = false
# readiness_window_secs = 30
